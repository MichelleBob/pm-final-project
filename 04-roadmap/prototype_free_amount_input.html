<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riverty – Free amount input (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EFEC; --panel:#FFFFFF; --ink:#12231C; --muted:#56665F; --line:#CBD6D1;
  --brand:#0B4A38; --brand-ink:#FFFFFF; --accent:#17B37A;
  --err:#A8241C; --err-bg:#FCEBE9;
  --dis-bg:#DCE4E0; --dis-ink:#7F8D87; --thumb-muted:#B3BFB9;
  --strip-bg:#DDE6E1; --tag-bg:#EEF3F0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512; --panel:#16211C; --ink:#E8F0EC; --muted:#9BADA5; --line:#2D3C35;
    --brand:#3FD39A; --brand-ink:#08261C; --accent:#3FD39A;
    --err:#FF9C94; --err-bg:#3A1F1D;
    --dis-bg:#25332D; --dis-ink:#6F8078; --thumb-muted:#42534B;
    --strip-bg:#1E2B25; --tag-bg:#1E2B25;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512; --panel:#16211C; --ink:#E8F0EC; --muted:#9BADA5; --line:#2D3C35;
  --brand:#3FD39A; --brand-ink:#08261C; --accent:#3FD39A;
  --err:#FF9C94; --err-bg:#3A1F1D;
  --dis-bg:#25332D; --dis-ink:#6F8078; --thumb-muted:#42534B;
  --strip-bg:#1E2B25; --tag-bg:#1E2B25;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px;
}
.proto{width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--muted); margin-bottom:10px}
.proto button{font:inherit; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer; padding:4px; margin-left:6px}
.proto button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
#checkout{width:100%; max-width:420px; font-size:13px; color:var(--muted); margin-bottom:10px; min-height:0}
#checkout div{padding:2px 0}
#checkout .bad{color:var(--err)}

.screen{width:100%; max-width:420px; background:var(--panel); border-radius:22px; padding:24px 22px 26px;
  border:1px solid var(--line); display:flex; flex-direction:column; min-height:600px}
.logo{font-weight:700; font-size:22px; letter-spacing:-0.02em; color:var(--brand); margin-bottom:28px}
h1{font-size:26px; line-height:1.2; margin:0 0 6px; letter-spacing:-0.015em; font-weight:700}
h1:focus{outline:none}
.sub{color:var(--muted); margin:0 0 20px}
.spacer{flex:1; min-height:20px}

.claims{border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:22px}
.row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.tag{display:inline-block; font-size:12px; color:var(--muted); background:var(--tag-bg); border:1px dashed var(--line); border-radius:6px; padding:1px 7px; margin-left:8px; font-weight:500}
.row .amt{font-weight:600}
.row.total{background:var(--tag-bg)}
.row.total .amt{font-size:20px; font-weight:700}

.btn{display:block; width:100%; height:54px; border:0; border-radius:14px; font:inherit; font-weight:700; font-size:17px;
  background:var(--brand); color:var(--brand-ink); cursor:pointer}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.btn:disabled{background:var(--dis-bg); color:var(--dis-ink); cursor:not-allowed}

.balance{font-weight:600; margin:0 0 18px; color:var(--muted)}
.field{display:flex; align-items:baseline; gap:8px; border:2px solid var(--line); border-radius:16px; padding:12px 18px; background:var(--panel)}
.field:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.field.invalid{border-color:var(--err)}
.field input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:34px; font-weight:700; outline:none; padding:0; letter-spacing:-0.01em}
.field input::placeholder{color:var(--dis-ink); font-size:20px; font-weight:500; letter-spacing:0}
.field .cur{font-size:28px; font-weight:600; color:var(--muted)}
.bounds{margin:8px 2px 0; color:var(--muted); font-size:15px}
.err{min-height:46px; margin:8px 0 0; padding:0 2px; color:var(--err); font-weight:600; font-size:15px}
.hint{margin:0 0 22px; color:var(--muted); font-size:15px}

.slider{-webkit-appearance:none; appearance:none; width:100%; height:32px; background:transparent; margin:0 0 6px; cursor:pointer}
.slider::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:linear-gradient(to right,var(--brand) var(--p,0%),var(--line) var(--p,0%))}
.slider::-moz-range-track{height:6px; border-radius:3px; background:var(--line)}
.slider::-moz-range-progress{height:6px; border-radius:3px; background:var(--brand)}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:var(--brand); border:3px solid var(--panel); box-shadow:0 0 0 1px var(--brand); margin-top:-11px}
.slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--brand); border:3px solid var(--panel); box-shadow:0 0 0 1px var(--brand)}
.slider.muted{--p:0%}
.slider.muted::-webkit-slider-thumb{background:var(--thumb-muted); box-shadow:0 0 0 1px var(--thumb-muted)}
.slider.muted::-moz-range-thumb{background:var(--thumb-muted); box-shadow:0 0 0 1px var(--thumb-muted)}
.slider.muted::-moz-range-progress{background:transparent}
.slider:focus-visible::-webkit-slider-thumb{outline:3px solid var(--accent); outline-offset:2px}
.slider:focus-visible::-moz-range-thumb{outline:3px solid var(--accent); outline-offset:2px}

.big{font-size:44px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; margin:6px 0 4px}
.big small{font-size:18px; font-weight:500; color:var(--muted); letter-spacing:0}
.facts{border:1px solid var(--line); border-radius:14px; margin:18px 0 20px}
.facts .row .k{color:var(--muted)}
.facts .row .v{font-weight:700}
.note{color:var(--ink); margin:0}
.debug{margin-top:22px; background:var(--strip-bg); border-radius:10px; padding:9px 12px; font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--muted)}
.debug b{color:var(--ink)}
@media (prefers-reduced-motion: no-preference){ .field{transition:border-color .12s} }
@media (max-width:440px){ body{padding:10px} .screen{min-height:calc(100vh - 80px); border-radius:18px} }
</style>
</head>
<body>

<div class="proto">
  <span id="where">Prototype · screen 1 of 3</span>
  <span><button id="restart" type="button">Restart</button><button id="checks" type="button">Run checks</button></span>
</div>
<div id="checkout" role="status" aria-live="polite"></div>
<main id="app"></main>

<script>
/* ---------- Placeholder configuration (not Riverty data) ---------- */
const TOTAL = 1240, MIN = 52, STEP = 5, MAXDIGITS = 7;
const CLAIMS = [{name:'Creditor A', amount:780}, {name:'Creditor B', amount:460}];
const FIRST_NAME = 'Mara';

/* Slider positions: MIN, then every 5 euros up to TOTAL */
const VALS = [MIN];
for (let v = 55; v <= TOTAL; v += STEP) VALS.push(v);

const fmt = n => '€' + n.toLocaleString('en-US');

/* ---------- Single state variable ---------- */
let S = { screen: 1, raw: '', amount: null, source: null, flag: false, locked: false, plan: null };

/* ---------- One validation function (used live and on submit, FR5/FR6/FR7) ---------- */
function validate(raw) {
  const s = String(raw).replace(/[€\s]/g, '');
  if (s === '') return { kind: 'empty' };
  if (/\D/.test(s)) return { kind: 'format', message: 'Please enter whole euros.' };
  const v = parseInt(s, 10);
  if (v < MIN) return { kind: 'low', message: 'The lowest amount that fits is ' + fmt(MIN) + '.' };
  if (v > TOTAL) return { kind: 'high', message: 'The maximum is your total open balance of ' + fmt(TOTAL) + '.' };
  return { kind: 'valid', value: v };
}

function nearestIdx(v) {
  let best = 0, bd = Infinity;
  VALS.forEach((x, i) => { const d = Math.abs(x - v); if (d < bd) { bd = d; best = i; } });
  return best;
}

/* ---------- Screens ---------- */
function screen1() {
  return `
  <section class="screen" aria-labelledby="t">
    <div class="logo">Riverty</div>
    <h1 id="t" tabindex="-1">Hi ${FIRST_NAME}</h1>
    <p class="sub">Your open claims</p>
    <div class="claims">
      ${CLAIMS.map(c => `<div class="row"><span class="name">${c.name}<span class="tag">placeholder</span></span><span class="amt">${fmt(c.amount)}</span></div>`).join('')}
      <div class="row total"><span class="name">Total open</span><span class="amt">${fmt(TOTAL)}</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="go" type="button">Pay in instalments</button>
  </section>`;
}

function screen2() {
  return `
  <section class="screen" aria-labelledby="t">
    <div class="logo">Riverty</div>
    <h1 id="t" tabindex="-1">How much can you pay per month?</h1>
    <p class="balance">Total open: ${fmt(TOTAL)}</p>
    <label class="field" id="field">
      <input id="amt" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Amount per month" aria-labelledby="t" aria-describedby="bounds err" aria-invalid="false">
      <span class="cur" aria-hidden="true">€</span>
    </label>
    <div class="bounds" id="bounds">${fmt(MIN)} to ${fmt(TOTAL)}</div>
    <div class="err" id="err" role="alert"></div>
    <input id="sl" class="slider muted" type="range" min="0" max="${VALS.length - 1}" step="1" value="0" aria-label="Monthly amount slider">
    <p class="hint">Base it on a weaker month, not your best one.</p>
    <div class="spacer"></div>
    <button class="btn" id="set" type="button" disabled>Set up plan</button>
  </section>`;
}

function screen3(plan) {
  const a = plan.amount;
  const n = Math.ceil(TOTAL / a);
  const last = TOTAL - (n - 1) * a;
  return `
  <section class="screen" aria-labelledby="t">
    <div class="logo">Riverty</div>
    <h1 id="t" tabindex="-1">Your plan is set up</h1>
    <div class="big">${fmt(a)} <small>per month</small></div>
    <div class="facts">
      <div class="row"><span class="k">Instalments</span><span class="v">${n}</span></div>
      ${last !== a ? `<div class="row"><span class="k">Last instalment</span><span class="v">${fmt(last)}</span></div>` : ''}
      <div class="row"><span class="k">Total</span><span class="v">${fmt(TOTAL)}</span></div>
    </div>
    <p class="note">Need to change something? Contact us.</p>
    <div class="spacer"></div>
    <div class="debug">debug · amount_source = <b>${plan.source}</b></div>
  </section>`;
}

/* ---------- Rendering and events ---------- */
const app = document.getElementById('app');
const where = document.getElementById('where');
let els = {};

function render() {
  where.textContent = 'Prototype · screen ' + S.screen + ' of 3';
  if (S.screen === 1) app.innerHTML = screen1();
  if (S.screen === 2) app.innerHTML = screen2();
  if (S.screen === 3) app.innerHTML = screen3(S.plan);
  const h = document.getElementById('t'); if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);

  if (S.screen === 1) {
    document.getElementById('go').addEventListener('click', () => { S.screen = 2; render(); });
  }
  if (S.screen === 2) {
    els = { input: document.getElementById('amt'), field: document.getElementById('field'), err: document.getElementById('err'),
            slider: document.getElementById('sl'), btn: document.getElementById('set') };
    els.input.addEventListener('input', onType);
    els.slider.addEventListener('input', onSlide);
    els.slider.addEventListener('pointerup', () => { if (S.amount === null) onSlide(); });
    els.btn.addEventListener('click', submit);
    update();
  }
}

/* Typing: field mirrors what was typed. Letters never get stored. Nothing is rounded or corrected. */
function onType() {
  const el = els.input, before = el.value;
  let cleaned = before.replace(/[^0-9.,€\s]/g, '');
  const flag = cleaned.length !== before.length;
  let n = 0, out = '';
  for (const ch of cleaned) {
    if (/\d/.test(ch)) { if (n >= MAXDIGITS) continue; n++; }
    out += ch;
  }
  cleaned = out;
  S.raw = cleaned; S.flag = flag;
  const r = validate(cleaned);
  if (r.kind === 'valid') { S.amount = r.value; S.source = 'typed'; }
  else if (r.kind === 'empty') { S.amount = null; S.source = null; }
  else { S.amount = null; S.source = 'typed'; }
  if (el.value !== cleaned) el.value = cleaned;
  update();
}

/* Dragging: slider value is written into the field */
function onSlide() {
  const v = VALS[+els.slider.value];
  S.amount = v; S.raw = String(v); S.source = 'slider'; S.flag = false;
  els.input.value = S.raw;
  update();
}

function update() {
  const r = validate(S.raw);
  const msg = S.flag ? 'Please enter whole euros.' : (r.message || '');
  const ok = r.kind === 'valid' && !S.flag && !S.locked;
  els.err.textContent = msg;
  els.field.classList.toggle('invalid', !!msg);
  els.input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  els.btn.disabled = !ok;
  const idx = S.amount !== null ? nearestIdx(S.amount) : 0;
  els.slider.value = idx;                                   // thumb snaps, field never changes (FR1)
  els.slider.classList.toggle('muted', S.amount === null);
  els.slider.style.setProperty('--p', (idx / (VALS.length - 1) * 100) + '%');
}

/* Submit: re-run the same validation against stored state (FR7) */
function submit() {
  if (S.locked) return;
  const r = validate(S.raw);
  if (r.kind !== 'valid' || S.flag || S.amount !== r.value || !S.source) { update(); return; }
  S.locked = true; els.btn.disabled = true;
  S.plan = { amount: r.value, source: S.source };
  S.screen = 3; render();
}

document.getElementById('restart').addEventListener('click', () => {
  S = { screen: 1, raw: '', amount: null, source: null, flag: false, locked: false, plan: null };
  document.getElementById('checkout').innerHTML = '';
  render();
});

/* ---------- Built-in checks: validation set (Eval 1) and banned-string scan (Eval 3) ---------- */
const CASES = [
  // valid
  ['52','valid'],['95','valid'],['100','valid'],['1240','valid'],['1000','valid'],['€95','valid'],['€ 95','valid'],
  ['  95  ','valid'],['0095','valid'],['1 240','valid'],
  // below min
  ['0','low'],['1','low'],['30','low'],['51','low'],['007','low'],
  // above max
  ['1241','high'],['1500','high'],['9999999','high'],['12345678901','high'],
  // decimals and separators
  ['95.5','format'],['95,50','format'],['1.240','format'],['1,240','format'],['€ 1.240','format'],
  ['95.','format'],['95,','format'],['0.5','format'],['.5','format'],[',5','format'],
  // text
  ['abc','format'],['95a','format'],['a95','format'],['ninety','format'],['9 5 x','format'],
  ['--5','format'],['-95','format'],['+95','format'],['1e3','format'],
  // empty
  ['','empty'],['   ','empty'],['€','empty'],[' € ','empty']
];
const BANNED = /recommended|most people|typical|safe|popular/i;

function runChecks() {
  const out = document.getElementById('checkout');
  const fails = CASES.filter(([i, k]) => validate(i).kind !== k);
  const plain = h => h.replace(/<[^>]+>/g, ' ');
  const texts = [screen1(), screen2(), screen3({ amount: 95, source: 'typed' })].map(plain);
  const hits = texts.filter(t => BANNED.test(t)).length;
  out.innerHTML =
    `<div class="${fails.length ? 'bad' : ''}">Validation: ${CASES.length - fails.length}/${CASES.length} cases classified correctly${fails.length ? ' – failed: ' + fails.map(f => JSON.stringify(f[0])).join(', ') : ''}</div>` +
    `<div class="${hits ? 'bad' : ''}">Banned-string scan: ${hits} screens with hits</div>`;
}
document.getElementById('checks').addEventListener('click', runChecks);

render();
</script>
</body>
</html>
